<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中美行业龙头对比看板</title>
<style>
:root {
  --bg-primary: #0f1117;
  --bg-secondary: #1a1d27;
  --bg-card: #1e2130;
  --bg-hover: #262a38;
  --border-color: #2a2d3a;
  --text-primary: #e8eaed;
  --text-secondary: #9aa0b0;
  --text-muted: #5f6577;
  --accent-blue: #4f8cff;
  --accent-green: #00b578;
  --accent-red: #ff4d5a;
  --accent-orange: #ff9f43;
  --accent-purple: #a55eea;
  --gradient-header: linear-gradient(135deg, #1a1d27 0%, #252840 100%);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
  --transition: 0.2s ease;
  --sidebar-w: 220px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; overflow-x: hidden;
}
/* ===== Header ===== */
.header {
  background: var(--gradient-header); border-bottom: 1px solid var(--border-color);
  padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); gap: 10px;
}
.header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo-icon {
  width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent-blue), #2ed8a3);
  border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: white; flex-shrink: 0;
}
.header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; }
.header-subtitle { font-size: 10px; color: var(--text-secondary); margin-top: 1px; display: none; }
.header-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.header-stat { text-align: right; }
.header-stat-value { font-size: 16px; font-weight: 700; }
.header-stat-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.update-time { font-size: 10px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
.update-dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ===== Mobile Menu Button ===== */
.menu-btn {
  display: none; width: 36px; height: 36px; border: 1px solid var(--border-color);
  background: var(--bg-card); border-radius: var(--radius-sm); cursor: pointer;
  align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-secondary); font-size: 18px;
}
.menu-btn:active { background: var(--bg-hover); }

/* ===== Sidebar ===== */
.sidebar-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); z-index: 150;
}
.sidebar-overlay.active { display: block; }
.main-container { display: flex; height: calc(100vh - 60px); }
.sidebar {
  width: var(--sidebar-w); background: var(--bg-secondary); border-right: 1px solid var(--border-color);
  overflow-y: auto; flex-shrink: 0; transition: transform 0.3s ease;
}
.sidebar-header {
  padding: 12px 16px 6px; font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-muted); font-weight: 600;
}
.concept-divider {
  padding: 8px 16px 4px; font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--accent-purple); font-weight: 600;
  border-top: 1px solid var(--border-color); margin-top: 4px;
}
.sector-nav-item {
  padding: 9px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--text-secondary); transition: all var(--transition);
  border-left: 3px solid transparent;
}
.sector-nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.sector-nav-item.active {
  background: rgba(79,140,255,0.08); color: var(--accent-blue); border-left-color: var(--accent-blue); font-weight: 600;
}
.sector-nav-item.concept.active {
  background: rgba(165,94,234,0.08); color: var(--accent-purple); border-left-color: var(--accent-purple);
}
.sector-icon { width: 26px; height: 26px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.sector-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sector-count { font-size: 10px; color: var(--text-muted); background: var(--bg-card); padding: 1px 7px; border-radius: 10px; flex-shrink: 0; }
.sector-nav-item.active .sector-count { background: rgba(79,140,255,0.15); color: var(--accent-blue); }
.sector-nav-item.concept.active .sector-count { background: rgba(165,94,234,0.15); color: var(--accent-purple); }

/* ===== Content ===== */
.content { flex: 1; overflow-y: auto; padding: 18px 24px; min-width: 0; }
.summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.summary-card {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
  padding: 12px 14px; display: flex; align-items: center; gap: 10px;
}
.summary-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.summary-info h3 { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; font-weight: 500; }
.summary-info .value { font-size: 18px; font-weight: 700; }

/* ===== Sector Panel ===== */
.sector-content { display: none; }
.sector-content.active { display: block; animation: fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.sector-title-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
.sector-title { font-size: 18px; font-weight: 700; }
.sector-title .concept-tag {
  font-size: 10px; background: rgba(165,94,234,0.15); color: var(--accent-purple);
  padding: 2px 8px; border-radius: 10px; margin-left: 8px; font-weight: 600;
}
.comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ===== Market Panel ===== */
.market-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); overflow: hidden; }
.panel-header {
  padding: 10px 16px; border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;
}
.panel-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.panel-flag { font-size: 18px; }
.panel-stats { font-size: 10px; color: var(--text-secondary); white-space: nowrap; }
.panel-stats .up { color: var(--accent-red); }
.panel-stats .down { color: var(--accent-green); }

/* ===== Table ===== */
.stock-table-wrap { overflow-x: auto; max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.stock-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 480px; }
.stock-table thead { position: sticky; top: 0; z-index: 1; }
.stock-table th {
  text-align: left; padding: 8px 12px; font-size: 10px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .5px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); white-space: nowrap;
}
.stock-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,45,58,0.4); white-space: nowrap; }
.stock-table tbody tr { transition: background var(--transition); }
.stock-table tbody tr:hover { background: var(--bg-hover); }
.rank-cell { width: 28px; text-align: center; font-weight: 700; font-size: 11px; color: var(--text-muted); }
.rank-1 { color: #ffc107 !important; } .rank-2 { color: #b0bec5 !important; } .rank-3 { color: #ff8a65 !important; }
.stock-name { font-weight: 600; color: var(--text-primary); }
.stock-code { font-size: 10px; color: var(--text-muted); margin-left: 3px; }
.price-cell { font-weight: 600; font-variant-numeric: tabular-nums; }
.change-cell { font-weight: 600; }
.market-cap-cell { color: var(--text-secondary); }
.up { color: var(--accent-red); } .down { color: var(--accent-green); }
.empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); }
.empty-state-icon { font-size: 36px; margin-bottom: 8px; opacity: .5; }

/* ===== Loading ===== */
#loadingOverlay {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
  padding: 18px 24px; display: flex; align-items: center; gap: 10px; z-index: 200; box-shadow: var(--shadow-lg);
}
.spinner { width: 18px; height: 18px; border: 2px solid var(--border-color); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== 股票行可点击样式 ===== */
.stock-table tbody tr.clickable { cursor: pointer; }
.stock-table tbody tr.clickable:hover td { background: rgba(79,140,255,0.06); }
.stock-name-link { text-decoration: none; color: inherit; }
.stock-name-link:hover .stock-name { color: var(--accent-blue); text-decoration: underline; }

/* ===== 编辑模式 ===== */
.edit-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-color); background: var(--bg-card);
  color: var(--text-secondary); cursor: pointer; font-size: 11px;
  transition: all var(--transition);
}
.edit-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
.edit-btn.active { border-color: var(--accent-orange); color: var(--accent-orange); background: rgba(255,159,67,.08); }
.panel-actions { display: flex; align-items: center; gap: 8px; }
.del-stock-btn {
  width: 18px; height: 18px; border-radius: 50%; background: var(--accent-red);
  color: white; border: none; cursor: pointer; font-size: 12px; line-height: 18px;
  text-align: center; flex-shrink: 0; display: none; transition: opacity .15s;
}
.del-stock-btn:hover { opacity: .75; }
.edit-mode .del-stock-btn { display: inline-flex; align-items: center; justify-content: center; }

/* ===== 添加股票弹窗 ===== */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,.6); z-index: 500; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
  padding: 20px 24px; width: min(420px, 92vw); max-height: 80vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: fadeIn .2s ease;
}
.modal-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.modal-close { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 20px; padding: 0 4px; }
.modal-close:hover { color: var(--text-primary); }
.modal-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
.modal-input {
  flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-color);
  color: var(--text-primary); padding: 8px 12px; border-radius: var(--radius-sm);
  font-size: 13px; outline: none;
}
.modal-input:focus { border-color: var(--accent-blue); }
.modal-btn {
  padding: 8px 14px; border-radius: var(--radius-sm); border: none;
  background: var(--accent-blue); color: white; cursor: pointer; font-size: 12px; font-weight: 600;
  white-space: nowrap;
}
.modal-btn:hover { opacity: .85; }
.modal-hint { font-size: 10.5px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.6; }
.modal-added-list { margin-top: 10px; }
.modal-added-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; background: var(--bg-secondary); border-radius: var(--radius-sm);
  margin-bottom: 5px; font-size: 12px;
}
.modal-added-name { font-weight: 600; }
.modal-added-code { color: var(--text-muted); font-size: 10px; margin-left: 5px; }
.modal-remove-btn { background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 16px; padding: 0 4px; }

/* ===== Desktop (>=1200px) ===== */
@media (min-width:1200px) {
  .header-subtitle { display: block; }
  .content { padding: 20px 28px; }
  .stock-table { font-size: 12.5px; }
  .stock-table th { padding: 9px 14px; }
  .stock-table td { padding: 8px 14px; }
}

/* ===== Tablet (<1200px) ===== */
@media (max-width:1199px) {
  .comparison-grid { grid-template-columns: 1fr; }
  .summary-bar { grid-template-columns: repeat(2,1fr); }
}

/* ===== Mobile (<768px) ===== */
@media (max-width:767px) {
  .menu-btn { display: flex; }
  .sidebar {
    position: fixed; top: 0; left: 0; height: 100%; z-index: 200;
    transform: translateX(-100%); box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .main-container { height: calc(100vh - 56px); }
  .header { padding: 10px 14px; }
  .header-title { font-size: 15px; }
  .header-subtitle { display: none; }
  .header-right { gap: 10px; }
  .header-stat-value { font-size: 14px; }
  .header-stat-label { font-size: 8px; }
  .update-time { font-size: 9px; }
  .content { padding: 12px 14px; }
  .summary-bar { grid-template-columns: repeat(2,1fr); gap: 8px; }
  .summary-card { padding: 10px 12px; }
  .summary-icon { width: 32px; height: 32px; font-size: 14px; }
  .summary-info .value { font-size: 15px; }
  .sector-title { font-size: 16px; }
  .comparison-grid { gap: 12px; }
  .stock-table { font-size: 11px; min-width: 440px; }
  .stock-table th { padding: 7px 10px; font-size: 9px; }
  .stock-table td { padding: 6px 10px; }
  .panel-header { padding: 8px 12px; }
  .panel-title { font-size: 12px; }
  .panel-flag { font-size: 16px; }
}

/* ===== Small mobile (<480px) ===== */
@media (max-width:479px) {
  .summary-bar { grid-template-columns: 1fr 1fr; gap: 6px; }
  .summary-card { padding: 8px 10px; gap: 8px; }
  .summary-info .value { font-size: 14px; }
  .summary-info h3 { font-size: 8px; }
  .sector-nav-item { padding: 8px 12px; font-size: 12px; }
  .sector-icon { width: 22px; height: 22px; font-size: 11px; }
}

/* Safe area for notched phones */
@supports (padding-top: env(safe-area-inset-top)) {
  .header { padding-top: max(12px, env(safe-area-inset-top)); }
  .sidebar { padding-top: env(safe-area-inset-top); }
}

/* ===== Refresh Button ===== */
.refresh-btn {
  padding: 5px 13px; background: rgba(79,140,255,.12);
  border: 1px solid rgba(79,140,255,.3); color: var(--accent-blue);
  border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; font-weight: 600;
  transition: all var(--transition); white-space: nowrap;
}
.refresh-btn:hover { background: rgba(79,140,255,.22); border-color: rgba(79,140,255,.5); }
.refresh-btn:disabled { opacity: .5; cursor: not-allowed; }
.refresh-btn.success { color: var(--accent-green); border-color: rgba(0,181,120,.4); background: rgba(0,181,120,.1); }
.refresh-btn.error { color: var(--accent-red); border-color: rgba(255,77,90,.4); background: rgba(255,77,90,.1); }
.refresh-toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
  padding: 10px 20px; font-size: 12px; z-index: 300; box-shadow: var(--shadow-lg);
  opacity: 0; transition: opacity .3s ease; pointer-events: none;
}
.refresh-toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="header">
  <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">☰</button>
  <div class="header-left">
    <div class="logo-icon">VS</div>
    <div><div class="header-title">中美行业龙头对比看板</div><div class="header-subtitle">US vs China Sector Leaders</div></div>
  </div>
  <div class="header-right">
    <div class="header-stat"><div class="header-stat-value" id="totalStocks">-</div><div class="header-stat-label">股票总数</div></div>
    <div class="header-stat"><div class="header-stat-value" id="totalSectors">-</div><div class="header-stat-label">板块</div></div>
    <div class="update-time"><div class="update-dot"></div><span id="updateTime">加载中...</span></div>
    <button id="refreshBtn" class="refresh-btn" onclick="refreshRealtime()">🔄 刷新行情</button>
  </div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="main-container">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="mainContent">
    <div class="summary-bar" id="summaryBar"></div>
    <div id="sectorPanels"></div>
  </main>
</div>
<div id="loadingOverlay"><div class="spinner"></div><span>数据加载中...</span></div>

<!-- 添加股票弹窗 -->
<div class="modal-overlay" id="addStockModal">
  <div class="modal-box">
    <div class="modal-title">
      <span id="modalTitle">添加股票</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <p class="modal-hint">
      输入股票代码（A股：如 <b>300750</b>、<b>600519</b>；美股：如 <b>NVDA</b>、<b>AAPL</b>），
      以及显示名称（选填）。添加后下次刷新数据时生效。
    </p>
    <div class="modal-input-row">
      <input class="modal-input" id="inputCode" placeholder="股票代码（如 300750）" />
      <input class="modal-input" id="inputName" placeholder="名称（选填）" style="max-width:120px" />
      <button class="modal-btn" onclick="addStockFromModal()">添加</button>
    </div>
    <div id="modalAddedList" class="modal-added-list"></div>
  </div>
</div>

<div class="refresh-toast" id="refreshToast"></div>

<script src="data.js" charset="UTF-8"></script>
<script>
/* ===== 配置 ===== */
const ICONS={
  "软件":"💻","半导体产品":"🔲","半导体设备":"⚙️","电脑硬件":"🖥️",
  "综合性银行":"🏦","综合零售":"🛒","制药":"💊","石油天然气":"🛢️",
  "航天航空国防":"✈️","生物科技":"🧬","投资银行":"📈","通信设备":"📡",
  "电力":"⚡","电气设备":"🔌","黄金":"🥇","大卖场超市":"🏪",
  "食品饮料":"🍔","汽车":"🚗","工业机械":"🏭",
  "AI硬件":"🤖","AI软件":"🧠","医药概念":"🏥","电气概念":"🔋"
};
const SECT_FULL={
  "软件":"软件（系统软件，应用软件）","半导体产品":"半导体产品","半导体设备":"半导体设备",
  "电脑硬件":"电脑硬件、存储设备及电脑周边","综合性银行":"综合性银行",
  "综合零售":"综合零售（互联网平台，电子商务）","制药":"制药",
  "石油天然气":"综合性石油与天然气企业","航天航空国防":"航天航空与国防",
  "生物科技":"生物科技","投资银行":"投资银行与经纪业务（券商，信托等）",
  "通信设备":"通信设备","电力":"电力","电气设备":"电气部件与设备",
  "黄金":"黄金","大卖场超市":"大卖场与超市","食品饮料":"食品饮料",
  "汽车":"汽车","工业机械":"工业机械",
  "AI硬件":"AI硬件产品及制造","AI软件":"AI软件应用及IT服务",
  "医药概念":"医药（中美可比）","电气概念":"电气设备（中美可比）"
};
const CONCEPT_KEYS=["AI硬件","AI软件","医药概念","电气概念"];
const INDUSTRY_KEYS=Object.keys(ICONS).filter(k=>!CONCEPT_KEYS.includes(k));

let data={}, cur=null;
// editMode: { sectorKey, market ('cn'|'us') }
let editMode=null;
// modalTarget: { sectorKey, market }
let modalTarget=null;
// customHidden: localStorage — 记录用户隐藏的股票 { sectorKey_market: [code,...] }
const LS_HIDDEN='dashboard_hidden_v1';
// customExtra: localStorage — 记录用户添加的股票 { sectorKey_market: [{code,name,price,change_pct,market_cap,pe},...] }
const LS_EXTRA='dashboard_extra_v1';

function loadHidden(){ try{ return JSON.parse(localStorage.getItem(LS_HIDDEN)||'{}'); }catch(e){ return {}; } }
function saveHidden(h){ localStorage.setItem(LS_HIDDEN,JSON.stringify(h)); }
function loadExtra(){ try{ return JSON.parse(localStorage.getItem(LS_EXTRA)||'{}'); }catch(e){ return {}; } }
function saveExtra(e){ localStorage.setItem(LS_EXTRA,JSON.stringify(e)); }

/* ===== 工具函数 ===== */
function fmtMC(v){
  if(!v||v===0) return '-';
  if(v>=1e12) return (v/1e12).toFixed(2)+' 万亿';
  if(v>=1e8) return (v/1e8).toFixed(2)+' 亿';
  return (v/1e4).toFixed(2)+' 万';
}
function chgCls(v){ if(v>0) return 'up'; if(v<0) return 'down'; return ''; }
function chgSign(v){ if(v>0) return '+'+v.toFixed(2)+'%'; if(v<0) return v.toFixed(2)+'%'; return '0.00%'; }
function isConcept(k){ return CONCEPT_KEYS.includes(k); }

/* ===== 行情跳转链接 ===== */
function stockLink(code, market){
  // market: 'cn' | 'us'
  if(market==='cn'){
    // 判断沪深
    const prefix=code.startsWith('6')||code.startsWith('9')?'sh':'sz';
    return `https://quote.eastmoney.com/${prefix}${code}.html`;
  } else {
    // 美股 → 雪球（对中国用户友好）
    return `https://xueqiu.com/S/${code.toUpperCase()}`;
  }
}

/* ===== 股票行渲染 ===== */
function stockRow(s, i, sectorKey, market, isEditMode){
  const hidden=loadHidden();
  const hKey=`${sectorKey}_${market}`;
  if(!isEditMode && hidden[hKey] && hidden[hKey].includes(s.code)) return '';

  const link=stockLink(s.code, market);
  const delBtn=isEditMode
    ? `<button class="del-stock-btn" title="隐藏此股" onclick="hideStock(event,'${sectorKey}','${market}','${s.code}')">×</button>`
    : '';
  return `<tr class="${isEditMode?'':'clickable'}" ${isEditMode?'':'onclick="window.open(\''+link+'\',\'_blank\')"'}>
    <td class="rank-cell ${i<3?'rank-'+(i+1):''}">${i+1}</td>
    <td style="display:flex;align-items:center;gap:6px;min-height:36px">
      ${delBtn}
      <a href="${link}" target="_blank" class="stock-name-link" onclick="event.stopPropagation()">
        <span class="stock-name">${s.name||'-'}</span><span class="stock-code">${s.code||''}</span>
      </a>
    </td>
    <td class="price-cell">${s.price?s.price.toFixed(2):'-'}</td>
    <td class="change-cell ${chgCls(s.change_pct)}">${chgSign(s.change_pct||0)}</td>
    <td class="market-cap-cell">${fmtMC(s.market_cap)}</td>
    <td class="market-cap-cell">${s.pe&&s.pe>0?s.pe.toFixed(1):'-'}</td>
  </tr>`;
}

/* ===== 面板构建 ===== */
function buildPanel(key){
  const d=data[key];
  if(!d) return '';
  const isConc=isConcept(key);
  const title=SECT_FULL[key]||key;
  return `<div class="sector-content" data-sector="${key}">
    <div class="sector-title-bar">
      <span class="sector-title">${title}${isConc?'<span class="concept-tag">概念板块</span>':''}</span>
    </div>
    <div class="comparison-grid">
      ${buildMarketPanel(key,'cn',d.a_share||{stocks:[],count:0},'🇨🇳','A股',title)}
      ${buildMarketPanel(key,'us',d.us||{stocks:[],count:0},'🇺🇸','美股',title)}
    </div>
  </div>`;
}

function buildMarketPanel(sectorKey, market, sdata, flag, label, title){
  const isEM=(editMode && editMode.sectorKey===sectorKey && editMode.market===market);
  const hidden=loadHidden();
  const extra=loadExtra();
  const hKey=`${sectorKey}_${market}`;

  // 合并原始数据 + 用户添加
  let allStocks=[...(sdata.stocks||[])];
  const extraStocks=extra[hKey]||[];
  if(extraStocks.length>0){
    const existCodes=new Set(allStocks.map(s=>s.code));
    extraStocks.forEach(s=>{ if(!existCodes.has(s.code)) allStocks.push(s); });
  }

  // 过滤隐藏
  if(!isEM){
    const hiddenCodes=new Set(hidden[hKey]||[]);
    allStocks=allStocks.filter(s=>!hiddenCodes.has(s.code));
  }
  const up=allStocks.filter(s=>s.change_pct>0).length;
  const down=allStocks.filter(s=>s.change_pct<0).length;
  const rows=allStocks.length
    ? allStocks.map((s,i)=>stockRow(s,i,sectorKey,market,isEM)).join('')
    : `<tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon">📊</div>暂无数据</div></td></tr>`;

  return `<div class="market-panel${isEM?' edit-mode':''}" id="panel_${sectorKey}_${market}">
    <div class="panel-header">
      <span class="panel-title"><span class="panel-flag">${flag}</span>${label} · ${title}</span>
      <div class="panel-actions">
        <span class="panel-stats">共 ${allStocks.length} 只 | <span class="up">涨 ${up}</span> <span class="down">跌 ${down}</span></span>
        <button class="edit-btn${isEM?' active':''}" onclick="toggleEditMode('${sectorKey}','${market}')">${isEM?'✅ 完成':'✏️ 编辑'}</button>
        ${isEM?`<button class="modal-btn" style="font-size:11px;padding:5px 10px" onclick="openAddModal('${sectorKey}','${market}')">+ 添加</button>`:''}
      </div>
    </div>
    <div class="stock-table-wrap">
      <table class="stock-table">
        <thead><tr><th>#</th><th>股票</th><th>股价</th><th>涨跌</th><th>市值</th><th>PE</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

/* ===== 编辑模式切换 ===== */
function toggleEditMode(sectorKey, market){
  if(editMode && editMode.sectorKey===sectorKey && editMode.market===market){
    editMode=null; // 关闭
  } else {
    editMode={sectorKey, market}; // 开启
  }
  rebuildPanel(sectorKey);
}

/* ===== 隐藏股票 ===== */
function hideStock(evt, sectorKey, market, code){
  evt.stopPropagation();
  const hidden=loadHidden();
  const key=`${sectorKey}_${market}`;
  if(!hidden[key]) hidden[key]=[];
  if(!hidden[key].includes(code)) hidden[key].push(code);
  saveHidden(hidden);
  rebuildPanel(sectorKey);
}

/* ===== 重建面板（局部刷新）===== */
function rebuildPanel(key){
  const container=document.querySelector(`.sector-content[data-sector="${key}"]`);
  if(!container) return;
  const wasActive=container.classList.contains('active');
  const newHTML=buildPanel(key);
  container.outerHTML=newHTML;
  if(wasActive){
    const el=document.querySelector(`.sector-content[data-sector="${key}"]`);
    if(el) el.classList.add('active');
  }
  // 同步更新 summary
  if(cur===key) updateSummary(key);
}

/* ===== 添加股票弹窗 ===== */
function openAddModal(sectorKey, market){
  modalTarget={sectorKey, market};
  document.getElementById('modalTitle').textContent=`添加股票 — ${market==='cn'?'🇨🇳 A股':'🇺🇸 美股'} · ${sectorKey}`;
  document.getElementById('inputCode').value='';
  document.getElementById('inputName').value='';
  renderModalList();
  document.getElementById('addStockModal').classList.add('open');
}
function closeModal(){
  document.getElementById('addStockModal').classList.remove('open');
  modalTarget=null;
  if(editMode) rebuildPanel(editMode.sectorKey);
}
function renderModalList(){
  if(!modalTarget) return;
  const {sectorKey,market}=modalTarget;
  const extra=loadExtra();
  const key=`${sectorKey}_${market}`;
  const list=extra[key]||[];
  const el=document.getElementById('modalAddedList');
  if(list.length===0){ el.innerHTML='<div style="font-size:11px;color:var(--text-muted);padding:6px 0">暂无自定义添加的股票</div>'; return; }
  el.innerHTML=list.map((s,i)=>`<div class="modal-added-item">
    <span><span class="modal-added-name">${s.name||s.code}</span><span class="modal-added-code">${s.code}</span></span>
    <button class="modal-remove-btn" title="移除" onclick="removeExtraStock(${i})">×</button>
  </div>`).join('');
}
function addStockFromModal(){
  if(!modalTarget) return;
  const code=document.getElementById('inputCode').value.trim().toUpperCase();
  if(!code){ alert('请输入股票代码'); return; }
  const name=document.getElementById('inputName').value.trim()||code;
  const {sectorKey,market}=modalTarget;
  const extra=loadExtra();
  const key=`${sectorKey}_${market}`;
  if(!extra[key]) extra[key]=[];
  // 重复检查
  if(extra[key].some(s=>s.code===code)){ alert('该股票已存在'); return; }
  // 先添加到列表（数据稍后由 fetchAndSaveStock 填充）
  const newStock={code,name,price:0,change_pct:0,market_cap:0,pe:0};
  extra[key].push(newStock);
  saveExtra(extra);
  document.getElementById('inputCode').value='';
  document.getElementById('inputName').value='';
  renderModalList();
  rebuildPanel(sectorKey);
  // 自动从腾讯API获取数据
  fetchAndSaveStock(sectorKey, market, code, name);
}

/** 通过腾讯API获取单只股票实时数据，更新到 extra 和 data */
async function fetchAndSaveStock(sectorKey, market, code, name){
  const sym = market==='cn' ? cnToTencent(code) : usToTencent(code);
  try {
    const r = await fetchTencentQuotes([sym]);
    const q = r[sym];
    if(q && q.price>0){
      // 更新 extra 中该股票的数据
      const extra=loadExtra();
      const key=`${sectorKey}_${market}`;
      const s=extra[key]?.find(x=>x.code===code);
      if(s){
        s.price=q.price;
        s.change_pct=q.change_pct;
        if(q.name && (!name||name===code)) s.name=q.name;
        saveExtra(extra);
        rebuildPanel(sectorKey);
        showToast(`${q.name} 已添加并获取数据`);
      }
      // 如果该股票也在 data 原始数据中，同步更新
      const ds=data[sectorKey];
      if(ds){
        const stocks=ds[market==='cn'?'a_share':'us']?.stocks||[];
        const orig=stocks.find(x=>x.code===code);
        if(orig){
          orig.price=q.price;
          orig.change_pct=q.change_pct;
        }
      }
    } else {
      showToast(`未获取到 ${name}(${code}) 的数据`);
    }
  }catch(e){
    console.warn('fetchAndSaveStock error:',e);
  }
}
function removeExtraStock(idx){
  if(!modalTarget) return;
  const {sectorKey,market}=modalTarget;
  const extra=loadExtra();
  const key=`${sectorKey}_${market}`;
  if(extra[key]) extra[key].splice(idx,1);
  saveExtra(extra);
  renderModalList();
}

/* ===== 切换板块 ===== */
function switchSector(key){
  document.querySelectorAll('.sector-nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.sector-content').forEach(el=>el.classList.remove('active'));
  const nav=document.querySelector(`.sector-nav-item[data-sector="${key}"]`);
  const panel=document.querySelector(`.sector-content[data-sector="${key}"]`);
  if(nav) nav.classList.add('active');
  if(panel) panel.classList.add('active');
  cur=key;
  editMode=null; // 切换板块时退出编辑
  updateSummary(key);
  if(window.innerWidth<768) closeSidebar();
}

function updateSummary(key){
  const d=data[key];
  if(!d) return;
  const cn=d.a_share||{stocks:[]};
  const us=d.us||{stocks:[]};
  const cnMC=cn.stocks.reduce((s,x)=>s+(x.market_cap||0),0);
  const usMC=us.stocks.reduce((s,x)=>s+(x.market_cap||0),0);
  document.getElementById('summaryMC_CN').textContent=fmtMC(cnMC);
  document.getElementById('summaryMC_US').textContent=fmtMC(usMC);
  document.getElementById('summaryCnt_CN').textContent=cn.stocks.length+' 只';
  document.getElementById('summaryCnt_US').textContent=us.stocks.length+' 只';
}

/* ===== 数据加载 ===== */
async function loadData(){
  // 优先尝试 fetch data.js（确保 UTF-8 解码，不受 <script> 标签编码影响）
  try{
    const resp=await fetch('data.js');
    if(resp.ok){
      const text=await resp.text();
      const match=text.match(/const\s+SECTOR_DATA\s*=\s*(\{[\s\S]*\});?\s*$/);
      if(match){
        const j=JSON.parse(match[1]);
        if(j && j.sectors){
          data=j.sectors;
          document.getElementById('updateTime').textContent='更新于 '+(j.generated_time||j.generated_at||'--').replace('T',' ').substring(0,16);
          initDash();
          return;
        }
      }
    }
  }catch(e){
    console.warn('Failed to fetch data.js:', e);
  }

  // Fallback: 检查全局 SECTOR_DATA（从 <script src> 加载时可用）
  if(typeof SECTOR_DATA !== 'undefined' && SECTOR_DATA && SECTOR_DATA.sectors){
    data=SECTOR_DATA.sectors;
    document.getElementById('updateTime').textContent='更新于 '+(SECTOR_DATA.generated_time||SECTOR_DATA.generated_at||'--').replace('T',' ').substring(0,16);
    initDash();
    return;
  }

  // Fallback: 尝试 sector_data.json
  try{
    const resp=await fetch('../data/sector_data.json');
    if(!resp.ok) throw new Error('no data');
    const j=await resp.json();
    data=j.sectors||{};
    document.getElementById('updateTime').textContent='更新于 '+(j.generated_time||'--').replace('T',' ').substring(0,16);
    initDash();
  }catch(e){
    console.warn('Data file unavailable, loading demo data');
    loadDemo();
  }
}

/* ===== 实时行情刷新（腾讯财经 JSONP） ===== */

/**
 * 腾讯财经 API (qt.gtimg.cn) — 支持 A股 + 美股，JSONP 无 CORS 限制
 * A股格式: v_sh600519="1~贵州茅台~600519~1790.00~1.50~0.08~..."
 * 美股格式: v_usNVDA="1~英伟达~NVDA~100.50~1.50~1.52~..."
 * parts[0]=状态(1正常) [1]=名称 [2]=代码 [3]=现价 [4]=涨跌额 [5]=涨跌幅(%)
 */
function fetchTencentQuotes(symbols) {
  return new Promise(resolve => {
    if (!symbols || symbols.length === 0) { resolve({}); return; }
    const result = {};
    // 每批最多80个（腾讯限制约100）
    const batchSize = 80;
    const batches = [];
    for (let i = 0; i < symbols.length; i += batchSize) {
      batches.push(symbols.slice(i, i + batchSize));
    }
    let done = 0;
    batches.forEach(batch => {
      const script = document.createElement('script');
      script.src = `https://qt.gtimg.cn/q=${batch.join(',')}`;
      script.onload = () => {
        batch.forEach(sym => {
          const raw = window['v_' + sym];
          if (raw) {
            try {
              const data = raw.replace(/^"|"$/g, '');
              const parts = data.split('~');
              if (parts[0] === '1' && parts.length > 5) {
                result[sym] = {
                  name: parts[1],
                  code: parts[2],
                  price: parseFloat(parts[3]) || 0,
                  change: parseFloat(parts[4]) || 0,
                  change_pct: parseFloat(parts[5]) || 0
                };
              }
            } catch(e) {}
          }
        });
        done++;
        if (done === batches.length) resolve(result);
      };
      script.onerror = () => {
        done++;
        if (done === batches.length) resolve(result);
      };
      document.body.appendChild(script);
      setTimeout(() => { try { script.remove(); } catch(e) {} }, 3000);
    });
  });
}

/** 构建 A 股腾讯代码: 6开头→sh, 其他→sz */
function cnToTencent(code) {
  return (code.startsWith('6') || code.startsWith('9')) ? 'sh' + code : 'sz' + code;
}

/** 构建 US 股腾讯代码 */
function usToTencent(code) {
  return 'us' + code.toUpperCase();
}

/** Toast 通知 */
function showToast(msg, duration) {
  duration = duration || 3000;
  const el = document.getElementById('refreshToast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

/** 刷新当前板块的实时行情 */
async function refreshRealtime() {
  const btn = document.getElementById('refreshBtn');
  if (!btn || btn.disabled) return;

  const sectorKey = cur;
  const sectorData = data[sectorKey];
  if (!sectorData) { showToast('无板块数据'); return; }

  btn.disabled = true;
  btn.textContent = '⏳ 刷新中...';
  btn.className = 'refresh-btn';

  try {
    // 收集当前板块的代码（包括 data 原始 + extra 手动添加）
    const cnStocks = sectorData.a_share?.stocks || [];
    const usStocks = sectorData.us?.stocks || [];
    const extra = loadExtra();
    const extraCn = extra[`${sectorKey}_cn`] || [];
    const extraUs = extra[`${sectorKey}_us`] || [];

    const cnSyms = cnStocks.map(s => cnToTencent(s.code));
    const usSyms = usStocks.map(s => usToTencent(s.code));
    // 额外收集手动添加的股票
    extraCn.forEach(s => { const sym = cnToTencent(s.code); if(!cnSyms.includes(sym)) cnSyms.push(sym); });
    extraUs.forEach(s => { const sym = usToTencent(s.code); if(!usSyms.includes(sym)) usSyms.push(sym); });
    const allSyms = [...cnSyms, ...usSyms];

    if (allSyms.length === 0) {
      btn.disabled = false;
      btn.textContent = '🔄 刷新行情';
      showToast('当前板块无股票');
      return;
    }

    // 并行请求 A 股 + 美股
    const [cnResult, usResult] = await Promise.all([
      cnSyms.length > 0 ? fetchTencentQuotes(cnSyms) : Promise.resolve({}),
      usSyms.length > 0 ? fetchTencentQuotes(usSyms) : Promise.resolve({})
    ]);

    // 更新 A 股数据
    let cnUpdated = 0;
    cnStocks.forEach(s => {
      const sym = cnToTencent(s.code);
      const r = cnResult[sym];
      if (r && r.price > 0) {
        s.price = r.price;
        s.change_pct = r.change_pct;
        cnUpdated++;
      }
    });

    // 更新美股数据（data 原始）
    let usUpdated = 0;
    usStocks.forEach(s => {
      const sym = usToTencent(s.code);
      const r = usResult[sym];
      if (r && r.price > 0) {
        s.price = r.price;
        s.change_pct = r.change_pct;
        usUpdated++;
      }
    });

    // 更新手动添加的股票（extra）
    let extraUpdated = 0;
    const cnExtra = extra[`${sectorKey}_cn`] || [];
    const usExtra = extra[`${sectorKey}_us`] || [];
    cnExtra.forEach(s => {
      const sym = cnToTencent(s.code);
      const r = cnResult[sym];
      if (r && r.price > 0) {
        s.price = r.price;
        s.change_pct = r.change_pct;
        if (r.name) s.name = r.name;
        extraUpdated++;
      }
    });
    usExtra.forEach(s => {
      const sym = usToTencent(s.code);
      const r = usResult[sym];
      if (r && r.price > 0) {
        s.price = r.price;
        s.change_pct = r.change_pct;
        if (r.name) s.name = r.name;
        extraUpdated++;
      }
    });
    if (extraUpdated > 0) saveExtra(extra);

    // 重新按涨跌幅排序
    cnStocks.sort((a, b) => (b.change_pct || 0) - (a.change_pct || 0));
    usStocks.sort((a, b) => (b.change_pct || 0) - (a.change_pct || 0));

    // 重建当前面板 UI
    rebuildPanel(sectorKey);

    const total = cnUpdated + usUpdated;
    if (total > 0) {
      btn.className = 'refresh-btn success';
      btn.textContent = `✅ 已刷新 ${total} 只`;
      showToast(`行情已刷新：A 股 ${cnUpdated} 只 | 美股 ${usUpdated} 只`);
    } else {
      btn.className = 'refresh-btn error';
      btn.textContent = '⚠️ 无数据';
      showToast('未获取到新数据（可能非交易时间或 API 限速）');
    }

    // 3秒后恢复按钮
    setTimeout(() => {
      if (btn) {
        btn.disabled = false;
        btn.textContent = '🔄 刷新行情';
        btn.className = 'refresh-btn';
      }
    }, 3000);

  } catch(e) {
    console.error('Refresh error:', e);
    btn.className = 'refresh-btn error';
    btn.textContent = '❌ 刷新失败';
    showToast('刷新失败: ' + (e.message || '网络错误'));
    setTimeout(() => {
      if (btn) { btn.disabled = false; btn.textContent = '🔄 刷新行情'; btn.className = 'refresh-btn'; }
    }, 3000);
  }
}

/**
 * 页面加载后自动静默修正所有板块的涨跌幅（用腾讯API数据覆盖异常值）
 * 批量获取所有股票，一次性请求修正
 */
async function autoFixChangePct(){
  const allKeys=[...INDUSTRY_KEYS,...CONCEPT_KEYS];

  // 1. 一次性收集所有板块的所有代码
  const allCnSyms = new Set();
  const allUsSyms = new Set();
  for(const key of allKeys){
    const sectorData = data[key];
    if(!sectorData) continue;
    (sectorData.a_share?.stocks||[]).forEach(s => allCnSyms.add(cnToTencent(s.code)));
    (sectorData.us?.stocks||[]).forEach(s => allUsSyms.add(usToTencent(s.code)));
    const extra = loadExtra();
    (extra[`${key}_cn`]||[]).forEach(s => allCnSyms.add(cnToTencent(s.code)));
    (extra[`${key}_us`]||[]).forEach(s => allUsSyms.add(usToTencent(s.code)));
  }

  if(allCnSyms.size === 0 && allUsSyms.size === 0) return;

  // 2. 批量请求（每批80个）
  try {
    const cnSyms = [...allCnSyms];
    const usSyms = [...allUsSyms];
    const cnBatches=[], usBatches=[];
    for(let i=0;i<cnSyms.length;i+=80) cnBatches.push(cnSyms.slice(i,i+80));
    for(let i=0;i<usSyms.length;i+=80) usBatches.push(usSyms.slice(i,i+80));

    const allCn={}, allUs={};
    for(const batch of cnBatches){
      const r=await fetchTencentQuotes(batch);
      Object.assign(allCn, r);
      if(cnBatches.length>1) await new Promise(x=>setTimeout(x,200));
    }
    for(const batch of usBatches){
      const r=await fetchTencentQuotes(batch);
      Object.assign(allUs, r);
      if(usBatches.length>1) await new Promise(x=>setTimeout(x,200));
    }

    // 3. 逐板块修正
    let totalFixed = 0;
    for(const key of allKeys){
      const sectorData = data[key];
      if(!sectorData) continue;
      (sectorData.a_share?.stocks||[]).forEach(s => {
        const sym=cnToTencent(s.code); const r=allCn[sym];
        if(r && r.price>0){ if(s.change_pct!==r.change_pct) totalFixed++; s.price=r.price; s.change_pct=r.change_pct; }
      });
      (sectorData.us?.stocks||[]).forEach(s => {
        const sym=usToTencent(s.code); const r=allUs[sym];
        if(r && r.price>0){ if(s.change_pct!==r.change_pct) totalFixed++; s.price=r.price; s.change_pct=r.change_pct; }
      });
      // extra
      const extra=loadExtra();
      let extraChanged=false;
      (extra[`${key}_cn`]||[]).forEach(s => {
        const sym=cnToTencent(s.code); const r=allCn[sym];
        if(r && r.price>0){ s.price=r.price; s.change_pct=r.change_pct; if(r.name) s.name=r.name; extraChanged=true; }
      });
      (extra[`${key}_us`]||[]).forEach(s => {
        const sym=usToTencent(s.code); const r=allUs[sym];
        if(r && r.price>0){ s.price=r.price; s.change_pct=r.change_pct; if(r.name) s.name=r.name; extraChanged=true; }
      });
      if(extraChanged) saveExtra(extra);
    }
    if(totalFixed > 0){
      rebuildPanel(cur);
      console.log(`[autoFix] 修正了 ${totalFixed} 只股票的涨跌幅`);
    }
  }catch(e){
    console.warn('[autoFix] failed:', e);
  }
}

// 页面加载完成后 1 秒自动修正涨跌幅
setTimeout(() => { autoFixChangePct(); }, 1000);
</script>
