<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Diagnostic</title></head>
<body>
<h1>Diagnostic</h1>
<div id="info"></div>
<script src="data.js" charset="UTF-8"></script>
<script>
const info = document.getElementById('info');
info.innerHTML = '<pre>' + JSON.stringify({
  has_SECTOR_DATA: typeof SECTOR_DATA !== 'undefined',
  has_sectors: typeof SECTOR_DATA !== 'undefined' && !!SECTOR_DATA.sectors,
  sector_keys: typeof SECTOR_DATA !== 'undefined' && SECTOR_DATA.sectors ? Object.keys(SECTOR_DATA.sectors) : [],
  first_key_bytes: typeof SECTOR_DATA !== 'undefined' && SECTOR_DATA.sectors ? Array.from(new TextEncoder().encode(Object.keys(SECTOR_DATA.sectors)[0])).map(b => b.toString(16).padStart(2,'0')).join(' ') : '',
  generated_at: typeof SECTOR_DATA !== 'undefined' ? SECTOR_DATA.generated_at : 'N/A'
}, null, 2) + '</pre>';
</script>
</body>
</html>
